# task type -> ordered list of providers to try, in order, until one succeeds.
# All 5 providers are confirmed working as of 2026-09-26 (AWS Marketplace
# payment + OpenAI credits both resolved). Cheapest/fastest tried first;
# Bedrock (Claude Haiku) is a stronger but pricier fallback before the free
# mock provider as the last resort.
tasks:
  chat:
    candidates:
      - workers_ai
      - vertex
      - openai
      - bedrock
      - mock
    # Measured via evals/scorecard.py on 2026-09-27: workers_ai scored 88% on
    # the 30-case golden set. quality_floor is the minimum a candidate must
    # score to be promoted out of canary (see `canary` section below).
    quality_floor: 0.80
    latency_budget_ms: 5000

  support_chat:
    candidates:
      - workers_ai
      - vertex
      - openai
      - bedrock
      - mock
    quality_floor: 0.80
    latency_budget_ms: 5000

  # Test-only task: mock is deliberately first so we can force it to fail
  # (prompt containing FORCE_429) and prove the fallback to workers_ai works.
  # Not used by any real client — verification/break-it tool only.
  test_fallback:
    candidates:
      - mock
      - workers_ai
    quality_floor: 0.0
    latency_budget_ms: 5000

  # Test-only task: ONLY mock, so we can force total failure (every candidate
  # broken) and confirm the system fails cleanly instead of hanging.
  test_total_outage:
    candidates:
      - mock
    quality_floor: 0.0
    latency_budget_ms: 5000

retry:
  max_attempts_per_provider: 2
  backoff_base_ms: 200
  backoff_max_ms: 2000

circuit_breaker:
  failure_threshold: 3        # consecutive failures before opening the breaker
  open_seconds: 30            # how long to skip a broken provider before retrying it

cache:
  ttl_seconds: 300

# Canary rollout: send a small % of "chat" task traffic to a candidate
# provider instead of the primary one, to test it on real traffic before
# fully switching over. Set weight to 0 to disable; the eval-driven rollback
# script (evals/canary_check.py) sets it back to 0 automatically if the
# candidate's score falls below quality_floor.
canary:
  task: chat
  primary: workers_ai
  candidate: openai
  candidate_weight: 0.0
