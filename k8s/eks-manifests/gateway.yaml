apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: eacp-gateway
      containers:
        - name: gateway
          image: 123153903243.dkr.ecr.us-east-1.amazonaws.com/eacp-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: EDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: EDGE_SECRET
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: CF_ACCOUNT_ID
            - name: CF_AIG_NAME
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: CF_AIG_NAME
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: CF_API_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: OPENAI_API_KEY
            - name: AWS_REGION
              value: "us-east-1"
            - name: GCP_PROJECT_ID
              value: "pelagic-cycle-479717-h4"
            - name: GCP_LOCATION
              value: "us-central1"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/app/wif-credential-config.json"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8000
      nodePort: 30080
