# Part 13 (AWS) — minimal in-cluster Prometheus so the Incident Agent has
# real metrics evidence on real EKS, not just logs/events/deploy history.
# Unlike local dev (Prometheus runs in Docker, scrapes the kind node's
# container IP — see prometheus/prometheus.yml), here Prometheus runs AS a
# pod in the same cluster/namespace as the gateway, so it scrapes the
# gateway's Service DNS name directly ("gateway:8000") — no cross-network
# addressing needed. Labeled environment="prod" to match what
# prometheus_client.py queries for, since EKS only runs one gateway here
# (no separate staging namespace like local kind).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: "eacp-gateway-prod"
        static_configs:
          - targets: ["gateway:8000"]
            labels:
              environment: "prod"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
