# Part 13 (AWS) — same genuinely-separate rollback service as the local kind
# chart (k8s/eacp-chart/templates/rollback-executor.yaml), ported as plain
# YAML. Own ServiceAccount, scoped via resourceNames to patch ONLY the
# "gateway" Deployment — the real-EKS gateway pod (service account
# eacp-gateway) still holds no write credentials of any kind, same
# investigate/act separation proven locally.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollback-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollback-executor-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["gateway"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollback-executor-binding
subjects:
  - kind: ServiceAccount
    name: rollback-executor
    namespace: default
roleRef:
  kind: Role
  name: rollback-executor-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollback-executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rollback-executor
  template:
    metadata:
      labels:
        app: rollback-executor
    spec:
      serviceAccountName: rollback-executor
      containers:
        - name: rollback-executor
          image: 123153903243.dkr.ecr.us-east-1.amazonaws.com/eacp-rollback-executor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: NAMESPACE
              value: default
            - name: DEPLOYMENT_NAME
              value: gateway
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rollback-executor
spec:
  selector:
    app: rollback-executor
  ports:
    - port: 8001
