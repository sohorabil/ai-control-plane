apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.gateway.port }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg://eacp:$(POSTGRES_PASSWORD)@postgres:5432/eacp"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: EDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: EDGE_SECRET
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: CF_ACCOUNT_ID
            - name: CF_AIG_NAME
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: CF_AIG_NAME
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: CF_API_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eacp-secrets
                  key: OPENAI_API_KEY
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: {{ .Values.gateway.port }}
      nodePort: 30080
