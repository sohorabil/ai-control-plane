gateway:
  image: eacp-gateway:local
  replicas: 1
  port: 8000
  nodePort: 30080  # Part 10: staging/prod deploys override this to avoid a collision
  # Off by default. Only for local kind testing, so Bedrock/Vertex work here
  # too (they otherwise only work from a real EKS pod via Pod Identity/WIF,
  # or your local terminal directly). Never turn this on for a real EKS
  # deploy — Pod Identity is the only correct mechanism there, and this
  # exists purely so this project's own gateway can be manually tested
  # end-to-end against real providers without needing real cloud infra up.
  localCloudCreds: false

postgres:
  image: pgvector/pgvector:pg16
  storage: 1Gi

redis:
  image: redis:7-alpine

# Non-secret config only — real values (EDGE_SECRET, CF_API_TOKEN, etc.) come
# from a Kubernetes Secret created separately (k8s/eacp-chart/secret-example.yaml
# shows the shape; the real one is never committed).
env:
  AWS_REGION: us-east-1
  GCP_PROJECT_ID: pelagic-cycle-479717-h4
  GCP_LOCATION: us-central1
