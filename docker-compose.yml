services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eacp
      POSTGRES_PASSWORD: eacp
      POSTGRES_DB: eacp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eacp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Part 10 — CI/CD. Named/ported distinctly from any other Jenkins on this
  # machine (project-scoped: container name, volume, and port are all
  # eacp-specific) so it never collides with or touches anything unrelated.
  jenkins:
    image: eacp-jenkins-tools:latest
    container_name: eacp-jenkins
    ports:
      - "8081:8080"   # Jenkins web UI (8080 was already taken on this machine)
      - "50001:50000" # Jenkins agent port
    volumes:
      - eacp-jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.kube/eacp-jenkins-config:/var/jenkins_home/.kube/config:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
      KUBECONFIG: /var/jenkins_home/.kube/config
    networks:
      - default
      - kind

  # Part 11 — observability. Needs the `kind` network too, same reason as
  # Jenkins: the gateway pods it scrapes live inside that separate Docker
  # network, not reachable via localhost from this container.
  prometheus:
    image: prom/prometheus:latest
    container_name: eacp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - default
      - kind

  grafana:
    image: grafana/grafana:latest
    container_name: eacp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Distributed tracing (OpenTelemetry backend). Unlike Prometheus (which
  # pulls from the gateway), the gateway PUSHES spans here over OTLP — so
  # this container needs the `kind` network too, same as the others, but
  # for the opposite traffic direction: gateway pods -> this container,
  # not this container -> gateway pods.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: eacp-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - default
      - kind

networks:
  default:
  kind:
    external: true

volumes:
  pgdata:
  eacp-jenkins-data:
    external: true
  prometheus-data:
  grafana-data:
