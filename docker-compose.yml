services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eacp
      POSTGRES_PASSWORD: eacp
      POSTGRES_DB: eacp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eacp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Part 10 — CI/CD. Named/ported distinctly from any other Jenkins on this
  # machine (project-scoped: container name, volume, and port are all
  # eacp-specific) so it never collides with or touches anything unrelated.
  jenkins:
    image: eacp-jenkins-tools:latest
    container_name: eacp-jenkins
    ports:
      - "8081:8080"   # Jenkins web UI (8080 was already taken on this machine)
      - "50001:50000" # Jenkins agent port
    volumes:
      - eacp-jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.kube/eacp-jenkins-config:/var/jenkins_home/.kube/config:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
      KUBECONFIG: /var/jenkins_home/.kube/config
    networks:
      - default
      - kind

networks:
  default:
  kind:
    external: true

volumes:
  pgdata:
  eacp-jenkins-data:
    external: true
